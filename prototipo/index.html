<title>Central CN Obras</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />

<style>
  /* =========================================================================
     DESIGN SYSTEM — fonte única de verdade (doc 05-prototipo-visual)
     Identidade fixa, tema claro (neutros quentes + azul-petróleo dessaturado).
     ========================================================================= */
  :root {
    /* Neutros com temperatura */
    --bg:            #F7F5F2;
    --surface:       #FFFFFF;
    --surface-raise: #FCFAF7;
    --border:        #E4DFD8;
    --border-strong: #D8D2C8;
    --text-2:        #6B6459;
    --text-1:        #2B2621;

    /* Acento — azul-petróleo dessaturado */
    --accent:        #3D7A8C;
    --accent-hover:  #336A7A;
    --accent-active: #2A5866;
    --accent-subtle: #E3EEF0;

    /* Status */
    --st-aberta:       #8A94A6; --st-aberta-bg:       #EEF1F5;
    --st-triada:       #3D7A8C; --st-triada-bg:       #E3EEF0;
    --st-execucao:     #C9821A; --st-execucao-bg:     #FBEFDC;
    --st-aguardando:   #B5643E; --st-aguardando-bg:   #F6E9E2;
    --st-concluida:    #4C8B5B; --st-concluida-bg:    #E7F2E9;
    --st-cancelada:    #9A968D; --st-cancelada-bg:    #F1EFEB;

    /* Prioridade */
    --pri-alta:   #C4453A; --pri-alta-bg: #FBE6E4;
    --pri-media:  #C9821A;

    /* Vencimento */
    --venc-vencida:  #C4453A;
    --venc-vencendo: #C9821A;

    --radius: 8px;
    --shadow-sm: 0 1px 2px rgba(43,38,33,.05), 0 1px 1px rgba(43,38,33,.03);
    --shadow-md: 0 2px 4px rgba(43,38,33,.05), 0 8px 22px -8px rgba(43,38,33,.14);
    --shadow-lg: 0 12px 40px -6px rgba(43,38,33,.22);

    --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

    --sidebar-w: 244px;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text-1);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  h1, h2, h3, h4 { margin: 0; text-wrap: balance; font-weight: 600; letter-spacing: -0.01em; }
  h1 { font-size: 32px; line-height: 40px; }
  h2 { font-size: 24px; line-height: 32px; }
  p  { margin: 0; }
  button { font-family: inherit; }

  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .label {
    font-size: 13px; line-height: 16px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-2);
  }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  svg { display: block; }
  .ic { width: 20px; height: 20px; stroke-width: 2; flex: none; }
  .ic-sm { width: 16px; height: 16px; }
  .ic-lg { width: 22px; height: 22px; }

  /* ---------- Prototype chrome: role switcher bar ---------- */
  .proto-bar {
    position: sticky; top: 0; z-index: 60;
    display: flex; align-items: center; gap: 14px;
    padding: 8px 16px;
    background: var(--text-1);
    color: #F2EFEA;
    font-size: 13px;
  }
  .proto-bar .pb-brand { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: .02em; }
  .proto-bar .pb-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(61,122,140,.25); }
  .proto-bar .pb-tag { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: #B9B2A6; }
  .proto-switch { display: flex; gap: 4px; margin-left: auto; background: rgba(255,255,255,.07); padding: 3px; border-radius: 999px; }
  .proto-switch button {
    border: 0; background: transparent; color: #CBC4B8; cursor: pointer;
    padding: 5px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 6px; transition: background .15s, color .15s;
  }
  .proto-switch button:hover { color: #fff; }
  .proto-switch button.on { background: var(--surface); color: var(--text-1); font-weight: 600; }
  @media (max-width: 720px) {
    .proto-bar .pb-tag { display: none; }
    .proto-switch button span { display: none; }
    .proto-switch button { padding: 7px 11px; }
  }

  /* ---------- App shell ---------- */
  .app { display: flex; min-height: calc(100vh - 41px); }

  .sidebar {
    width: var(--sidebar-w); flex: none;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: 20px 14px;
    position: sticky; top: 41px; height: calc(100vh - 41px);
  }
  .side-brand { display: flex; align-items: center; gap: 11px; padding: 4px 8px 20px; }
  .side-logo {
    width: 38px; height: 38px; border-radius: 9px; flex: none;
    background: linear-gradient(160deg, var(--accent), var(--accent-active));
    color: #fff; display: grid; place-items: center;
  }
  .side-brand .sb-name { font-weight: 700; font-size: 15px; letter-spacing: .01em; line-height: 1.15; }
  .side-brand .sb-sub { font-size: 12px; color: var(--text-2); }

  .nav-group-label { padding: 14px 10px 6px; }
  .nav-item {
    width: 100%; text-align: left; border: 0; background: transparent; cursor: pointer;
    display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: var(--radius);
    color: var(--text-2); font-size: 14.5px; font-weight: 500; margin-bottom: 2px;
    position: relative; transition: background .13s, color .13s;
  }
  .nav-item:hover { background: var(--surface-raise); color: var(--text-1); }
  .nav-item.on { background: var(--accent-subtle); color: var(--accent-active); font-weight: 600; }
  .nav-item.on::before { content: ""; position: absolute; left: -14px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
  .nav-item .ic { color: currentColor; }
  .nav-item .nav-count {
    margin-left: auto; font-size: 12px; font-weight: 600; font-family: var(--mono);
    background: var(--bg); color: var(--text-2); padding: 1px 8px; border-radius: 999px;
    border: 1px solid var(--border);
  }
  .nav-item.on .nav-count { background: var(--surface); color: var(--accent-active); border-color: var(--accent-subtle); }

  .side-user { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 8px 2px; border-top: 1px solid var(--border); }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%; flex: none;
    background: var(--accent-subtle); color: var(--accent-active);
    display: grid; place-items: center; font-weight: 700; font-size: 13px;
  }
  .side-user .su-name { font-size: 13.5px; font-weight: 600; }
  .side-user .su-role { font-size: 12px; color: var(--text-2); }

  /* ---------- Main ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 28px; border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: saturate(1.1) blur(6px);
    position: sticky; top: 41px; z-index: 30;
  }
  .topbar .tb-title { font-size: 15px; font-weight: 600; }
  .topbar .tb-sub { font-size: 13px; color: var(--text-2); }
  .icon-btn {
    width: 38px; height: 38px; border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--surface); color: var(--text-2); cursor: pointer; display: grid; place-items: center;
    transition: background .13s, color .13s, border-color .13s;
  }
  .icon-btn:hover { color: var(--text-1); border-color: var(--border-strong); }
  .hamburger { display: none; }

  .content { padding: 28px; max-width: 1100px; width: 100%; margin: 0 auto; }
  .page-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 4px; }
  .page-head .ph-text { flex: 1; min-width: 0; }
  .page-head h1 { font-size: 27px; line-height: 34px; }
  .page-head .eyebrow { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em; color: var(--accent); margin-bottom: 7px; display: flex; align-items: center; gap: 7px; }
  .page-head .eyebrow .ic-sm { width: 14px; height: 14px; }
  .page-head p.sub { color: var(--text-2); margin-top: 6px; font-size: 14.5px; }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border-radius: var(--radius); border: 1px solid transparent; cursor: pointer;
    font-size: 14.5px; font-weight: 600; padding: 10px 16px; line-height: 1;
    transition: background .14s, color .14s, border-color .14s, box-shadow .14s;
  }
  .btn-primary { background: var(--accent); color: #fff; box-shadow: var(--shadow-sm); }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:active { background: var(--accent-active); }
  .btn-ghost { background: var(--surface); color: var(--text-1); border-color: var(--border); }
  .btn-ghost:hover { border-color: var(--border-strong); background: var(--surface-raise); }
  .btn-quiet { background: transparent; color: var(--text-2); }
  .btn-quiet:hover { background: var(--surface-raise); color: var(--text-1); }
  .btn-danger { background: transparent; color: var(--pri-alta); border-color: color-mix(in srgb, var(--pri-alta) 30%, var(--border)); }
  .btn-danger:hover { background: var(--pri-alta-bg); }
  .btn-lg { padding: 15px 20px; font-size: 15.5px; min-height: 56px; }
  .btn-block { width: 100%; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }

  /* ---------- Cards / surfaces ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--shadow-sm);
  }
  .card-pad { padding: 20px; }

  /* ---------- Chips ---------- */
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 600; padding: 3px 10px 3px 8px; border-radius: 999px;
    line-height: 1.4; white-space: nowrap;
  }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
  .st-aberta     { color: var(--st-aberta);     background: var(--st-aberta-bg); }
  .st-triada     { color: var(--st-triada);     background: var(--st-triada-bg); }
  .st-em_execucao{ color: var(--st-execucao);   background: var(--st-execucao-bg); }
  .st-aguardando { color: var(--st-aguardando); background: var(--st-aguardando-bg); }
  .st-concluida  { color: var(--st-concluida);  background: var(--st-concluida-bg); }
  .st-cancelada  { color: var(--st-cancelada);  background: var(--st-cancelada-bg); }

  .pri { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; }
  .pri-alta  { color: var(--pri-alta); }
  .pri-media { color: var(--pri-media); }
  .pri-baixa { color: var(--text-2); }
  .pri .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  /* ---------- Prazo badge ---------- */
  .prazo {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--mono); font-variant-numeric: tabular-nums;
    font-weight: 600; font-size: 13.5px;
  }
  .prazo .ic-sm { width: 15px; height: 15px; }
  .prazo-vencida  { color: var(--venc-vencida); }
  .prazo-vencendo { color: var(--venc-vencendo); }
  .prazo-emdia    { color: var(--text-2); }
  .prazo-concluida{ color: var(--st-concluida); }

  .meta { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 13.5px; }
  .meta .ic-sm { color: var(--text-2); }

  /* ---------- KPI summary strip ---------- */
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 20px 0 26px; }
  .kpi {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
    display: flex; flex-direction: column; gap: 3px; text-align: left; cursor: pointer;
    transition: border-color .14s, box-shadow .14s, transform .14s;
  }
  .kpi:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--kpi-c, var(--accent)); }
  .kpi .kpi-top { display: flex; align-items: center; gap: 8px; }
  .kpi .kpi-ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--kpi-bg, var(--accent-subtle)); color: var(--kpi-c, var(--accent)); }
  .kpi .kpi-ic .ic { width: 17px; height: 17px; }
  .kpi .kpi-num { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 30px; font-weight: 600; line-height: 1.1; color: var(--kpi-c, var(--text-1)); letter-spacing: -0.02em; }
  .kpi .kpi-lbl { font-size: 13px; color: var(--text-2); font-weight: 500; }
  .kpi.k-vencida  { --kpi-c: var(--venc-vencida);  --kpi-bg: var(--pri-alta-bg); }
  .kpi.k-vencendo { --kpi-c: var(--venc-vencendo); --kpi-bg: var(--st-execucao-bg); }
  .kpi.k-exec     { --kpi-c: var(--accent);        --kpi-bg: var(--accent-subtle); }
  @media (max-width: 560px) { .kpis { grid-template-columns: 1fr; gap: 10px; } .kpi { flex-direction: row; align-items: center; justify-content: space-between; } .kpi .kpi-num { font-size: 24px; } }

  /* ---------- Category glyph ---------- */
  .cat-glyph { width: 34px; height: 34px; border-radius: 9px; flex: none; display: grid; place-items: center; background: var(--accent-subtle); color: var(--accent-active); }
  .cat-glyph .ic { width: 18px; height: 18px; }
  .cat-glyph.sm { width: 30px; height: 30px; border-radius: 8px; }
  .cat-glyph.sm .ic { width: 16px; height: 16px; }

  /* ---------- Painel de Prazos ---------- */
  .deadline-group { margin-bottom: 26px; }
  .dg-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding: 0 2px; }
  .dg-head .dg-marker { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .dg-head h3 { font-size: 14px; font-weight: 700; letter-spacing: .01em; }
  .dg-head .dg-count { font-family: var(--mono); font-size: 12.5px; font-weight: 600; color: var(--text-2); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 1px 9px; }

  .rowlist { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-sm); }
  .drow {
    display: grid; grid-template-columns: auto 1fr auto; gap: 6px 15px; align-items: center;
    width: 100%; text-align: left; border: 0; background: transparent; cursor: pointer;
    padding: 14px 18px 14px 15px; border-bottom: 1px solid var(--border);
    border-left: 3px solid transparent; transition: background .12s, border-color .12s;
  }
  .drow:last-child { border-bottom: 0; }
  .drow:hover { background: var(--surface-raise); }
  .drow.sev-vencida  { border-left-color: var(--venc-vencida); }
  .drow.sev-vencida  { background: linear-gradient(90deg, color-mix(in srgb, var(--pri-alta-bg) 55%, transparent), transparent 34%); }
  .drow.sev-vencida:hover { background: linear-gradient(90deg, var(--pri-alta-bg), transparent 42%); }
  .drow.sev-vencendo { border-left-color: var(--venc-vencendo); }
  .drow.sev-exec     { border-left-color: color-mix(in srgb, var(--accent) 55%, transparent); }
  .drow-glyph { grid-row: span 2; }
  .drow-main { min-width: 0; }
  .drow-title { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 9px; }
  .drow-title .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drow-sub { display: flex; align-items: center; gap: 8px 14px; margin-top: 5px; flex-wrap: wrap; }
  .drow-right { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; grid-row: span 2; }
  .drow-prazo-lg { font-family: var(--mono); font-weight: 600; font-size: 16px; }

  .row-enter { animation: rowEnter .5s cubic-bezier(.2,.7,.3,1); }
  .row-flash { position: relative; }
  .row-flash::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: var(--accent-subtle); opacity: .0; animation: flash 2.4s ease-out;
  }
  @keyframes rowEnter { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  @keyframes flash { 0% { opacity: .75; } 100% { opacity: 0; } }
  .live-pill {
    display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-2);
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 4px 11px 4px 9px;
  }
  .live-pill .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--st-concluida); box-shadow: 0 0 0 0 rgba(76,139,91,.5); animation: pulse 2.2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(76,139,91,.45); } 70% { box-shadow: 0 0 0 6px rgba(76,139,91,0); } 100% { box-shadow: 0 0 0 0 rgba(76,139,91,0); } }

  .empty { text-align: center; padding: 30px 20px; color: var(--text-2); background: var(--surface); border: 1px dashed var(--border-strong); border-radius: 12px; }
  .empty .ic { width: 30px; height: 30px; margin: 0 auto 10px; color: var(--border-strong); stroke-width: 1.6; }
  .empty p { font-size: 14px; }

  /* ---------- Filters ---------- */
  .filters { display: flex; align-items: center; gap: 10px; margin: 18px 0 22px; flex-wrap: wrap; }
  .select {
    appearance: none; -webkit-appearance: none;
    background: var(--surface) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236B6459' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>") no-repeat right 11px center;
    border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 34px 9px 12px;
    font-size: 14px; color: var(--text-1); cursor: pointer; font-family: inherit;
  }
  .select:hover { border-color: var(--border-strong); }

  /* ---------- Triagem: master-detail ---------- */
  .triage-wrap { display: grid; grid-template-columns: 340px 1fr; gap: 22px; align-items: start; }
  .triage-list { display: flex; flex-direction: column; gap: 10px; }
  .tcard {
    text-align: left; width: 100%; cursor: pointer; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; padding: 14px 15px;
    box-shadow: var(--shadow-sm); transition: border-color .13s, box-shadow .13s, transform .13s;
  }
  .tcard:hover { border-color: var(--accent); box-shadow: var(--shadow-md); }
  .tcard.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-subtle); }
  .tcard .tc-title { font-weight: 600; font-size: 14.5px; margin-bottom: 6px; }
  .tcard .tc-meta { display: flex; align-items: center; gap: 12px; }
  .tcard .tc-age { font-size: 12px; color: var(--text-2); font-family: var(--mono); }

  .field { margin-bottom: 18px; }
  .field > label { display: block; margin-bottom: 7px; }
  .field .req { color: var(--pri-alta); }
  .input, .textarea {
    width: 100%; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); padding: 11px 13px; font-size: 15px; color: var(--text-1);
    font-family: inherit; transition: border-color .13s, box-shadow .13s;
  }
  .input:focus, .textarea:focus, .select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-subtle); }
  .textarea { resize: vertical; min-height: 92px; line-height: 1.5; }
  .field-help { font-size: 12.5px; color: var(--text-2); margin-top: 6px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .seg { display: inline-flex; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 3px; gap: 3px; }
  .seg button { border: 0; background: transparent; cursor: pointer; padding: 8px 15px; border-radius: 6px; font-size: 14px; font-weight: 600; color: var(--text-2); display: inline-flex; align-items: center; gap: 7px; transition: background .12s, color .12s; }
  .seg button:hover { color: var(--text-1); }
  .seg button.on { background: var(--surface); box-shadow: var(--shadow-sm); }
  .seg button.on.p-alta { color: var(--pri-alta); }
  .seg button.on.p-media { color: var(--pri-media); }
  .seg button.on.p-baixa { color: var(--text-1); }

  .form-actions { display: flex; gap: 12px; margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--border); }

  /* ---------- Executor: card grid ---------- */
  .status-block { margin-bottom: 26px; }
  .sb-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .dcard {
    text-align: left; cursor: pointer; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 17px; box-shadow: var(--shadow-sm);

/* ---------- Helpers de data / prazo ---------- */
function prazoDate(off){ return new Date(HOJE.getTime() + off*DAY); }
function fmtDate(d){ return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'); }
function fmtDateFull(d){ return fmtDate(d)+'/'+d.getFullYear(); }
function prazoLabel(off, status){
  if(status==="concluida") return {cls:"prazo-concluida", ic:"checkCircle", txt:"Concluída"};
  if(off===null||off===undefined) return {cls:"prazo-emdia", ic:"clock", txt:"Sem prazo"};
  const d = prazoDate(off);
  if(off < 0) return {cls:"prazo-vencida",  ic:"alert", txt:`Venceu há ${Math.abs(off)}d`};
  if(off === 0) return {cls:"prazo-vencendo", ic:"clock", txt:"Vence hoje"};
  if(off <= 3) return {cls:"prazo-vencendo", ic:"clock", txt:`Vence em ${off}d`};
  return {cls:"prazo-emdia", ic:"calendar", txt:fmtDate(d)};
}
function relTime(off){
  if(off===0) return "hoje";
  if(off===-1) return "ontem";
  return `há ${Math.abs(off)} dias`;
}
const STATUS_LABEL = { aberta:"Aberta", triada:"Triada", em_execucao:"Em execução", aguardando:"Aguardando", concluida:"Concluída", cancelada:"Cancelada" };

function statusChip(status){
  return `<span class="chip st-${status}"><span class="dot"></span>${STATUS_LABEL[status]}</span>`;
}
function prioTag(p){
  if(!p) return "";
  const lbl = {alta:"Alta",media:"Média",baixa:"Baixa"};
  return `<span class="pri pri-${p}"><span class="dot"></span>${lbl[p]}</span>`;
}
function execAvatar(key, extraCls){
  if(!key) return "";
  const e = EXECUTORES[key];
  return `<span class="avatar" style="width:24px;height:24px;font-size:10px" title="${e.nome}">${e.iniciais}</span>`;
}
function esc(s){ return (s||"").replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function getDemanda(id){ return DEMANDAS.find(d=>d.id===id); }

      ${kpi("k-vencida","alert",vencidas.length,vencidas.length===1?"demanda vencida":"demandas vencidas")}

/* Simulação de tempo real: nova demanda aparece sozinha */
let liveTimer = null;
function scheduleLive(){
  clearTimeout(liveTimer);
  if(state.screen!=="prazos" || state.loading) return;
  if(DEMANDAS.some(d=>d.id==="CN-0146")) return;
  liveTimer = setTimeout(()=>{
    if(state.screen!=="prazos") return;
    const nova = { id:"CN-0146", titulo:"Infiltração na parede da sala infantil", descricao:"Mancha de umidade aumentando.",
      solicitanteNome:"Prof. Bruna", solicitanteWhatsapp:"5562988004455", localOriginal:"Sala infantil",
      status:"triada", categoria:"Alvenaria", local:"Sala infantil", prioridade:"media", prazoOff:1, executor:"rafael",
      fotos:[], hist:[{tipo:"criada",quando:0,actor:null,desc:"Demanda aberta pelo formulário público"},{tipo:"triada",quando:0,actor:"Ana (liderança)",desc:"Alvenaria · atribuída a Rafael Costa"}] };
    DEMANDAS.unshift(nova);
    const groups = document.getElementById("prazos-groups");
    if(!groups) return;
    // re-render apenas o grupo "Vencendo": recomputa e injeta com animação
    const vencendo = DEMANDAS.filter(d=>!["concluida","cancelada","aberta"].includes(d.status) && d.prazoOff>=0 && d.prazoOff<=3).sort((a,b)=>a.prazoOff-b.prazoOff);
    const list = groups.querySelectorAll(".rowlist")[1];
    const countEl = groups.querySelectorAll(".dg-count")[1];
    if(list){
      list.insertAdjacentHTML("afterbegin", deadlineRow(nova, true));
      if(countEl) countEl.textContent = vencendo.length;
      bindRows();
    }
  }, 3800);
}

function prazoDefault(){ const d = prazoDate(5); return fmtDateFull(d); }
function fmtPhone(w){ // 5562988440132 -> (62) 98844-0132
  const n = w.replace(/\D/g,'');
  const ddd = n.slice(2,4), a = n.slice(4,9), b = n.slice(9);
  return `(${ddd}) ${a}-${b}`;
}

function screenMinhas(){
  const minhas = DEMANDAS.filter(d=>d.executor==="marcos");
  const grupos = [
    { st:"em_execucao", list: minhas.filter(d=>d.status==="em_execucao") },
    { st:"aguardando",  list: minhas.filter(d=>d.status==="aguardando") },
    { st:"triada",      list: minhas.filter(d=>d.status==="triada") },
    { st:"concluida",   list: minhas.filter(d=>d.status==="concluida") },
  ];
  if(!minhas.length){
    return `<div class="empty" style="margin-top:20px">${ic("hardHat")}<p>Nenhuma demanda atribuída a você</p></div>`;
  }
  const blocks = grupos.filter(g=>g.list.length).map(g=>`
    <section class="status-block">
      <div class="sb-head">${statusChip(g.st)}<span class="dg-count">${g.list.length}</span></div>
      <div class="card-grid">${g.list.sort((a,b)=>(a.prazoOff??99)-(b.prazoOff??99)).map(execCard).join("")}</div>

}

function execCard(d){

function screenDetalhe(){
  const d = getDemanda(state.demandaId) || DEMANDAS[0];

  const timeline = d.hist.slice().reverse().map((h,i)=>{
    const nodeCls = h.tipo==="concluida" ? "done" : (h.tipo==="criada" ? "" : "accent");

    return `<div class="tl-item">

  // ações do executor

        <button class="btn btn-ghost btn-block" style="justify-content:flex-start">${ic("calendar","ic-sm")} Alterar prazo / prioridade</button>
        <button class="btn btn-danger btn-block" style="justify-content:flex-start">${ic("x","ic-sm")} Cancelar demanda</button>

function tlTitle(t){ return { criada:"Demanda aberta", triada:"Triada", status:"Status alterado", foto:"Fotos anexadas", concluida:"Demanda concluída", cancelada:"Demanda cancelada" }[t] || "Evento"; }

function waMessage(d, tipo){
  const primeiro = d.solicitanteNome.split(" ")[0];
  const prazoTxt = d.prazoOff!=null ? fmtDateFull(prazoDate(d.prazoOff)) : "a definir";
  if(tipo==="em_execucao") return `Olá, ${primeiro}! Aqui é da Central CN Obras. Sua solicitação "${d.titulo}" (${d.id}) já está *em execução*. Previsão de conclusão: ${prazoTxt}. Qualquer novidade, avisamos por aqui.`;
  if(tipo==="aguardando") return `Olá, ${primeiro}! Sobre a solicitação "${d.titulo}" (${d.id}): ela está *aguardando* — precisamos de uma peça/etapa antes de continuar. Assim que possível retomamos e te avisamos.`;
  return `Olá, ${primeiro}! A solicitação "${d.titulo}" (${d.id}) foi *concluída*. Obrigado por avisar a Central CN Obras! Qualquer coisa, é só abrir uma nova solicitação.`;
}
function waBox(d){
  const msg = waMessage(d, state.waTipo);
  const link = `https://wa.me/${d.solicitanteWhatsapp}?text=${encodeURIComponent(msg)}`;
  const opt = (v,l)=>`<button type="button" class="seg-mini ${state.waTipo===v?'on':''}" data-wa="${v}">${l}</button>`;
  return `
    <div class="seg" style="width:100%;margin:8px 0 6px" data-seg="wa">
      ${optSeg("em_execucao","Em execução")}${optSeg("aguardando","Aguardando")}${optSeg("concluida","Concluída")}
    </div>
    <div class="wa-msg">${esc(msg)}</div>
    <div class="wa-actions">
      <a class="btn wa-open" href="${link}" target="_blank" rel="noopener">${ic("message","ic-sm")} Abrir no WhatsApp</a>
      <button class="btn btn-ghost" data-copy="${esc(msg)}">${ic("copy","ic-sm")} Copiar</button>
    </div>`;
}
function optSeg(v,l){ return `<button type="button" data-wa="${v}" class="${state.waTipo===v?'on':''}" style="flex:1;font-size:12.5px;padding:7px 8px">${l}</button>`; }

    return `<div class="card rec-card" style="opacity:${r.ativa?1:.62}">

}

function skTriagem(){ return `<div class="sk" style="height:34px;width:150px;margin-bottom:22px"></div><div class="triage-wrap"><div style="display:flex;flex-direction:column;gap:10px">${Array(3).fill('<div class="card" style="height:92px"><div class="sk" style="height:100%;border-radius:12px;opacity:.5"></div></div>').join("")}</div><div class="card" style="height:520px"><div class="sk" style="height:100%;border-radius:12px;opacity:.5"></div></div></div>`; }
function skDetalhe(){ return `<div class="sk" style="height:20px;width:80px;margin-bottom:18px"></div><div class="sk" style="height:36px;width:70%;margin-bottom:22px"></div><div class="detail-grid"><div class="card" style="height:360px"><div class="sk" style="height:100%;border-radius:12px;opacity:.5"></div></div><div class="card" style="height:260px"><div class="sk" style="height:100%;border-radius:12px;opacity:.5"></div></div></div>`; }

/* =============================================================================
   NAVEGAÇÃO com skeleton
   ============================================================================= */
function go(screen, opts={}){
  state.screen = screen;
  Object.assign(state, opts);
  state.sidebarOpen = false;
  const withData = ["prazos","triagem","minhas","recorrencias","detalhe"].includes(screen);
  if(withData){
    state.loading = true;
    render();
    setTimeout(()=>{ state.loading = false; render(); if(screen==="prazos") scheduleLive(); }, 620);
  } else {
    state.loading = false;
    render();
  }
}

/* =============================================================================
   BIND
   ============================================================================= */
function bindRows(){
  document.querySelectorAll("[data-open]").forEach(el=>{
    el.onclick = ()=> go("detalhe", { demandaId: el.getAttribute("data-open") });
  });
}
function bind(){
  // proto bar
  document.querySelectorAll("[data-proto]").forEach(b=>{
    b.onclick = ()=>{
      const mode = b.getAttribute("data-proto");
      const role = b.getAttribute("data-role");
      clearTimeout(liveTimer);
      if(mode==="app"){ state.mode="app"; state.role=role; state.screen = role==="lideranca"?"prazos":"minhas"; go(state.screen); }
      else { state.mode=mode; state.publicSubmitted=false; render(); }
    };
  });
  // sidebar nav
  document.querySelectorAll("[data-nav]").forEach(b=> b.onclick = ()=> go(b.getAttribute("data-nav")));
  document.querySelectorAll("[data-open-side]").forEach(b=> b.onclick = ()=>{ state.sidebarOpen=true; render(); });
  document.querySelectorAll("[data-close-side]").forEach(b=> b.onclick = ()=>{ state.sidebarOpen=false; render(); });
  bindRows();
  // detalhe back
  document.querySelectorAll("[data-back]").forEach(b=> b.onclick = ()=> go(state.role==="lideranca"?"prazos":"minhas"));
  // triagem
  document.querySelectorAll("[data-triage]").forEach(b=> b.onclick = ()=>{ state.triageSel=b.getAttribute("data-triage"); render(); });
  document.querySelectorAll("[data-seg='prio'] button").forEach(b=> b.onclick = ()=>{
    b.parentElement.querySelectorAll("button").forEach(x=>{ x.classList.remove("on"); x.className = x.className.replace(/\bp-\w+\b/,'')+' '+('p-'+x.getAttribute('data-v')); });
    b.classList.add("on");
  });
  const saveBtn = document.querySelector("[data-triage-save]");
  if(saveBtn) saveBtn.onclick = ()=>{
    const d = getDemanda(state.triageSel);
    if(d){ d.status="triada"; d.prazoOff=5; d.executor="marcos"; d.categoria=d.categoria||"Hidráulica"; d.local=d.local||"Salão social"; d.prioridade=d.prioridade||"media"; d.hist.push({tipo:"triada",quando:0,actor:"Ana (liderança)",desc:"Demanda triada e atribuída"}); }
    toast("Triagem salva — demanda movida para Triada");
    go("triagem");
  };
  const cancelBtn = document.querySelector("[data-triage-cancel]");
  if(cancelBtn) cancelBtn.onclick = ()=>{
    const d = getDemanda(state.triageSel);
    if(d){ d.status="cancelada"; }
    toast("Demanda cancelada");
    go("triagem");
  };
  // detalhe: status
  document.querySelectorAll("[data-setstatus]").forEach(b=> b.onclick = ()=>{
    const d = getDemanda(state.demandaId);
    const st = b.getAttribute("data-setstatus");
    if(d){
      d.status = st;
      if(st==="concluida"){ d.concluidaOff=0; d.hist.push({tipo:"concluida",quando:0,actor:"Marcos Silva",desc:"Demanda concluída"}); }
      else d.hist.push({tipo:"status",quando:0,actor:"Marcos Silva",desc:"Status alterado para "+STATUS_LABEL[st]});
    }
    toast("Status atualizado: "+STATUS_LABEL[st]);
    render();
  });
  // wa seg
  document.querySelectorAll("[data-wa]").forEach(b=> b.onclick = ()=>{ state.waTipo=b.getAttribute("data-wa"); render(); });
  document.querySelectorAll("[data-copy]").forEach(b=> b.onclick = ()=>{
    const t = b.getAttribute("data-copy");
    if(navigator.clipboard) navigator.clipboard.writeText(t).catch(()=>{});
    toast("Mensagem copiada");
  });
  // recorrências
  document.querySelectorAll("[data-rec-toggle]").forEach(b=> b.onclick = ()=>{
    const r = RECORRENCIAS.find(x=>x.id===b.getAttribute("data-rec-toggle"));
    if(r){ r.ativa=!r.ativa; if(!r.ativa) r.proxOff=null; else if(r.proxOff==null) r.proxOff=20; }
    render();
  });
  // admin toggle
  document.querySelectorAll("[data-admin-toggle]").forEach(b=> b.onclick = ()=>{
    const [key,idx] = b.getAttribute("data-admin-toggle").split(":");
    const arr = key==="cat"?CATS:LOCS; const it = arr[+idx];
    if(key==="cat") it.ativa=!it.ativa; else it.ativo=!it.ativo;
    render();
  });
  // public
  const ps = document.querySelector("[data-public-submit]");
  if(ps) ps.onclick = ()=>{
    ps.innerHTML = `<span class="sk" style="width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.5)"></span> Enviando…`;
    ps.disabled = true;
    setTimeout(()=>{ state.publicSubmitted=true; render(); }, 700);
  };
  const pa = document.querySelector("[data-public-again]");
  if(pa) pa.onclick = ()=>{ state.publicSubmitted=false; render(); };
  // login
  const ll = document.querySelectorAll("[data-login-lider]"); ll.forEach(b=> b.onclick = ()=>{ state.mode="app"; state.role="lideranca"; go("prazos"); });
  const le = document.querySelector("[data-login-exec]"); if(le) le.onclick = ()=>{ state.mode="app"; state.role="executor"; go("minhas"); };
}

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg){
  let t = document.getElementById("toast");
  if(!t){ t = document.createElement("div"); t.id="toast"; document.body.appendChild(t);
    t.style.cssText = "position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text-1);color:#F2EFEA;padding:12px 18px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);z-index:200;opacity:0;transition:opacity .2s, transform .2s;display:flex;align-items:center;gap:9px;max-width:90vw"; }
  t.innerHTML = ic("checkCircle","ic-sm")+"<span>"+msg+"</span>";
  requestAnimationFrame(()=>{ t.style.opacity="1"; t.style.transform="translateX(-50%) translateY(0)"; });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.style.opacity="0"; t.style.transform="translateX(-50%) translateY(20px)"; }, 2200);
}

/* ---------- init ---------- */
render();
scheduleLive();
</script>
